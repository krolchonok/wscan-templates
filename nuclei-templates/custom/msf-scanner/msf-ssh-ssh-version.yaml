id: msf-ssh-ssh-version

info:
  name: SSH Version Scanner
  author: metasploit (ported from metasploit-framework auxiliary/scanner/ssh/ssh_version)
  severity: info
  description: |
    Detect SSH Version, and the server encryption
  reference:
    - https://github.com/rapid7/metasploit-framework/blob/master/modules/auxiliary/scanner/ssh/ssh_version.rb
