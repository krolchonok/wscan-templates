id: msf-scada-modbusdetect

info:
  name: Modbus Version Scanner
  author: metasploit (ported from metasploit-framework auxiliary/scanner/scada/modbusdetect)
  severity: info
  description: |
    This module detects the Modbus service, tested on a SAIA PCD1.M2 system. Modbus is a clear text protocol used in common SCADA systems, developed originally as a serial-line (RS232) async protocol, and later transformed to IP, which is called ModbusTCP.
  reference:
    - https://github.com/rapid7/metasploit-framework/blob/master/modules/auxiliary/scanner/scada/modbusdetect.rb
  tags: msf,scada,modbusdetect,modbus

tcp:
  - inputs:
      - data: "210000000006010400010000"
        type: hex
    host:
      - "{{Hostname}}"
    port: 502
    read-size: 4096
    matchers:
      - type: binary
        part: data
        binary:
          - "21000000"
