id: msf-rsync-modules-list

info:
  name: List Rsync Modules
  author: ikkini (ported from metasploit-framework auxiliary/scanner/rsync/modules_list)
  severity: info
  description: |
    Auto-ported from Metasploit rsync/modules_list.rb
  reference:
    - https://github.com/rapid7/metasploit-framework/blob/master/modules/auxiliary/scanner/rsync/modules_list.rb
  tags: msf,rsync,modules,list

tcp:
  - inputs:
      - data: "#{rmodule}\n"
      - data: "#list\n"
      - data: "#{RSYNC_HEADER} #{version}\n"
    host:
      - "{{Hostname}}"
    port: 873
    read-size: 4096
    matchers:
      - type: regex
        part: data
        regex:
          - "^#{RSYNC_HEADER} AUTHREQD \\S+$"
      - type: regex
        part: data
        regex:
          - "^#{RSYNC_HEADER} OK$"
      - type: regex
        part: data
        regex:
          - "^#{RSYNC_HEADER} EXIT$"
