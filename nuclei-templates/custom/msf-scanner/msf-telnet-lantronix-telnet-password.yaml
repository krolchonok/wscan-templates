# AUTOGENERATED by library/tools/gen_msf_scanner.py — do not edit by hand
id: msf-telnet-lantronix-telnet-password

info:
  name: Lantronix Telnet Password Recovery
  author: jgor (ported from metasploit-framework auxiliary/scanner/telnet/lantronix_telnet_password)
  severity: info
  description: |
    This module retrieves the setup record from Lantronix serial-to-ethernet devices via the config port (30718/udp, enabled by default) and extracts the telnet password. It has been tested successfully on a Lantronix Device Server with software version V5.8.0.1.
  reference:
    - https://github.com/rapid7/metasploit-framework/blob/master/modules/auxiliary/scanner/telnet/lantronix_telnet_password.rb
  tags: msf,telnet,lantronix,password,recovery

tcp:
  - inputs:
      - data: "000000f8"
        type: hex
    host:
      - "{{Hostname}}"
    port: 30718
    read-size: 4096
    udp: true
    matchers:
      - type: binary
        part: data
        binary:
          - "00000000"
