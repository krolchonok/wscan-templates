id: msf-misc-clamav-control

info:
  name: ClamAV Remote Command Transmitter
  author: Alejandro Hdeza,bwatters-r7,wvu (ported from metasploit-framework auxiliary/scanner/misc/clamav_control)
  severity: info
  description: |
    In certain configurations, ClamAV will bind to all addresses and listen for commands. This module sends properly-formatted commands to the ClamAV daemon if it is in such a configuration.
  reference:
    - https://github.com/rapid7/metasploit-framework/blob/master/modules/auxiliary/scanner/misc/clamav_control.rb
  tags: msf,clamav,control,remote,command

tcp:
  - inputs:
      - data: "VERSION\n"
    host:
      - "{{Hostname}}"
    port: 3310
    read-size: 4096
    matchers:
      - type: regex
        part: data
        regex:
          - "."
