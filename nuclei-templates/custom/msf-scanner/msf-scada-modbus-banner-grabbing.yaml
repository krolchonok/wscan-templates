id: msf-scada-modbus-banner-grabbing

info:
  name: Modbus Banner Grabbing
  author: metasploit (ported from metasploit-framework auxiliary/scanner/scada/modbus_banner_grabbing)
  severity: info
  description: |
    This module grabs the banner of any device running the Modbus protocol by sending a request with Modbus Function Code 43 (Read Device Identification). Modbus is a data communications protocol originally published by Modicon (now Schneider Electric) in 1979 for use with its programmable logic controllers (PLCs).
  reference:
    - https://github.com/rapid7/metasploit-framework/blob/master/modules/auxiliary/scanner/scada/modbus_banner_grabbing.rb
  tags: msf,scada,modbus,banner,grabbing

tcp:
  - inputs:
      - data: "446200000005ff2b0e0300"
        type: hex
    host:
      - "{{Hostname}}"
    port: 502
    read-size: 4096
    matchers:
      - type: binary
        part: data
        binary:
          - "2b0e"
      - type: word
        part: data
        words:
          - "Modbus Banner Grabbing"
