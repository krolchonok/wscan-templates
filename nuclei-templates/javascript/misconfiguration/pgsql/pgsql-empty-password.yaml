id: pgsql-empty-password

info:
  name: "PostgreSQL: принят пустой пароль после запроса аутентификации"
  author: pussycat0x
  severity: high
  description: |
    Локальная правка wscan: выполняет вход postgres с пустым паролем и наблюдает
    AuthenticationRequest на том же соединении. Отмечает только успешный вход,
    когда сервер действительно запросил пароль; доступ без запроса пароля
    относится к unauth-psql. TCP обычно 5432, база postgres, без записи.
    Для штатных современных PostgreSQL пустой пароль не является допустимым
    способом парольной аутентификации. TLS-only доступ не поддержан этой проверкой.
  reference:
    - https://www.tenable.com/plugins/nessus/104031
  metadata:
    verified: true
    max-request: 1
    shodan-query: "product:\"PostgreSQL\""
  tags: js,network,postgresql,authenticated,vuln

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      const postgres = require('nuclei/postgres');
      const client = new postgres.PGClient;
      const connected = client.ConnectWithPassword(Host, Port, User, Pass);
      connected;

    args:
      Host: "{{Host}}"
      Port: 5432
      User: "postgres"
      Pass: ""

    matchers:
      - type: dsl
        dsl:
          - "success == true"
          - "response == true"
        condition: and
