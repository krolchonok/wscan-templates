id: msf-misc-ibm-mq-enum

info:
  name: Identify Queue Manager Name and MQ Version
  author: Petros Koutroumpis (ported from metasploit-framework auxiliary/scanner/misc/ibm_mq_enum)
  severity: info
  description: |
    Run this auxiliary against the listening port of an IBM MQ Queue Manager to identify its name and version. Any channel type can be used to get this information as long as the name of the channel is valid.
  reference:
    - https://github.com/rapid7/metasploit-framework/blob/master/modules/auxiliary/scanner/misc/ibm_mq_enum.rb
  tags: msf,ibm,enum,identify,queue

tcp:
  - inputs:
      - data: "TSH "
    host:
      - "{{Hostname}}"
    port: 1414
    read-size: 4096
    matchers:
      - type: binary
        part: data
        binary:
          - "02000000"
      - type: binary
        part: data
        binary:
          - "18000000"
      - type: binary
        part: data
        binary:
          - "01000000"
