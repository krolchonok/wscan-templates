id: msf-ssl-openssl-heartbleed

info:
  name: OpenSSL Heartbeat (Heartbleed) Information Leak
  author: Neel Mehta,Riku,Antti,Matti (ported from metasploit-framework auxiliary/scanner/ssl/openssl_heartbleed)
  severity: high
  description: |
    This module implements the OpenSSL Heartbleed attack. The problem exists in the handling of heartbeat requests, where a fake length can be used to leak memory data in the response. Services that support STARTTLS may also be vulnerable. The module supports several actions, allowing for scanning, dumping of memory contents to loot, and private key recovery. The LEAK_COUNT option can be used to specify leaks per SCAN or DUMP. The repeat command can be used to make running the SCAN or DUMP many times more powerful. As in: repeat -t 60 run; sleep 2 To run every two seconds for one minute.
  reference:
    - https://github.com/rapid7/metasploit-framework/blob/master/modules/auxiliary/scanner/ssl/openssl_heartbleed.rb
  classification:
    cve-id: CVE-2014-0160
  tags: msf,ssl,openssl,heartbleed,heartbeat

tcp:
  - inputs:
      - data: "EHLO #{Rex::Text.rand_text_alpha(10)}\r\n"
      - data: "STARTTLS\r\n"
      - data: "a001 CAPABILITY\r\n"
      - data: "a002 STARTTLS\r\n"
      - data: "00000008"
        type: hex
      - data: "CAPA\r\n"
      - data: "STLS\r\n"
      - data: "Unknown error"
      - data: "AUTH TLS\r\n"
    host:
      - "{{Hostname}}"
    port: 443
    read-size: 4096
    matchers:
      - type: regex
        part: data
        regex:
          - "STARTTLS"
      - type: regex
        part: data
        regex:
          - "S"
      - type: regex
        part: data
        regex:
          - "^-"
