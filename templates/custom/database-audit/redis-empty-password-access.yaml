id: redis-empty-password-access
info:
  name: 'Redis: AUTH с пустым паролем принят'
  author: wscan
  severity: high
  description: Отправляет настоящий AUTH с пустой строкой пароля для стандартного Redis-пользователя,
    затем INFO. Успех требует redis_version в ответе. В отличие от redis-no-auth-access запрос AUTH действительно
    отправляется. TCP обычно 6379, только выбранный сервис; не проверяет именованные ACL-пользователи
    и TLS. Учётка не нужна; одна попытка входа, без записи и внешних запросов.
  reference:
  - https://redis.io/docs/latest/commands/auth/
  - https://redis.io/docs/latest/commands/info/
  metadata:
    vendor: redis
    product: redis
    max-request: 1
  tags: redis,network,empty-password,auth,misconfig
javascript:
- code: var m = require('nuclei/redis'); m.GetServerInfoWithEmptyPassword(Host, Port);
  args:
    Host: '{{Host}}'
    Port: 6379
  matchers:
  - type: word
    words:
    - 'redis_version:'
