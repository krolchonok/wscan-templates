id: microsoft-winrm-auth-methods
info:
  name: 'WinRM: объявленные методы аутентификации — HTTP challenge'
  author: wscan
  severity: info
  description: Читает WWW-Authenticate при 401 и Microsoft-HTTPAPI; перечисляет объявленные методы, не подтверждая
    успешный вход, Kerberos, поддержку CBT или уязвимость NTLM. Проверяется Microsoft WinRM выбранного HTTP(S)-сервиса,
    обычно TCP 5985/5986; соседние порты не проверяются. Один POST /wsman без учётки, Authorization и попытки входа.
    Редиректы отключены; нет команд, записи или изменения настроек. Прокси и нестандартный URL prefix могут скрыть
    сервис; ошибка транспорта не означает безопасную конфигурацию.
  reference:
  - https://learn.microsoft.com/en-us/powershell/scripting/learn/remoting/winrmsecurity
  - https://learn.microsoft.com/en-us/windows/win32/winrm/authentication-for-remote-connections
  metadata:
    vendor: microsoft
    product: winrm
    max-request: 1
  tags: discovery,winrm,windows,auth-methods
http:
- method: POST
  path:
  - '{{BaseURL}}/wsman'
  redirects: false
  max-size: 65536
  matchers-condition: and
  matchers:
  - type: status
    status:
    - 401
  - type: regex
    part: header
    regex:
    - (?im)^server\s*:\s*Microsoft-HTTPAPI/[0-9.]+
  - type: regex
    part: header
    regex:
    - (?im)^www-authenticate\s*:\s*(?:Basic|NTLM|Negotiate|Kerberos|CredSSP)(?:\s|,|$)
  extractors:
  - type: regex
    name: advertised-authentication
    part: header
    group: 1
    regex:
    - (?im)^www-authenticate\s*:\s*([^\r\n]+)
