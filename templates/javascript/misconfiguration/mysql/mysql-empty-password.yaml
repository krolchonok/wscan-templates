id: mysql-empty-password

info:
  name: MySQL - Empty Password
  author: DhiyaneshDk
  severity: high
  description: |
    Локальная правка wscan: проверяет настоящий пустой пароль для root и пустого имени пользователя.
    Выполняет вход и PING на выбранном MySQL-порту (обычно 3306), без SQL-запросов и записи.
    Успех означает доступ с указанной идентичностью и пустым паролем; фактическая учётка может
    сопоставляться сервером с anonymous. Ошибки транспорта не являются отрицательным результатом.
  metadata:
    max-request: 3
    shodan-query: "port:3306"
  tags: js,mysql,network,vuln

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/mysql");
      var c = m.MySQLClient();
      c.Connect(Host,Port,User,Pass)

    args:
      Host: "{{Host}}"
      Port: "3306"
      User: "{{username}}"
      Pass: ""

    payloads:
      username:
        - root
        - ""

    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - "response == true"
          - "success == true"
        condition: and
