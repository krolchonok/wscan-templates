id: postgres-default-logins

info:
  name: Postgres - Default Logins
  author: Ice3man
  severity: high
  description: |
    Локальная правка wscan: успешный вход с легко угадываемым паролем после
    фактического запроса парольной аутентификации. Доступ без запроса пароля
    проверяется отдельно; пользователь и база postgres ограничивают применимость.
    TCP обычно 5432, выбранный порт; SSL-only конфигурации этим клиентом не проверяются.
  metadata:
    max-request: 9
    shodan-query: port:5432
  tags: js,postgresql,default-login,network,vuln

javascript:
  - pre-condition: |
      var m = require("nuclei/postgres");
      var c = m.PGClient();
      c.IsPostgres(Host, Port);
    code: |
      var m = require("nuclei/postgres");
      var c = m.PGClient();
      c.ConnectWithPassword(Host, Port, User, Pass);
    args:
      Host: "{{Host}}"
      Port: "5432"
      User: "{{usernames}}"
      Pass: "{{passwords}}"
    attack: clusterbomb
    payloads:
      usernames:
        - "postgres"
        - "admin"
      passwords:
        - "password"
        - "secret"
        - "admin"
        - "postgres"
    stop-at-first-match: true
    matchers:
      - type: dsl
        dsl:
          - "response == true"
          - "success == true"
        condition: and
