id: redis-default-logins
info:
  name: Redis - Default Logins
  author: tarunKoyalwar
  severity: high
  description: 'Локальная правка wscan: AUTH с непустыми легко угадываемыми паролями

    стандартного пользователя, затем INFO на выбранном порту (обычно 6379).

    Доступ без AUTH проверяется отдельно, это не пустой AUTH-пароль.

    Именованные Redis ACL-пользователи и TLS этим шаблоном не проверяются.

    '
  metadata:
    max-request: 4
    shodan-query: product:"redis"
    product: redis
    vendor: redis
  tags: js,redis,default-login,network,vuln
javascript:
- pre-condition: 'isPortOpen(Host,Port)

    '
  code: 'var m = require("nuclei/redis");

    m.GetServerInfoAuth(Host,Port,Password);

    '
  args:
    Host: '{{Host}}'
    Port: '6379'
    Password: '{{passwords}}'
  payloads:
    passwords:
    - root
    - password
    - admin
    - iamadmin
  stop-at-first-match: true
  matchers-condition: and
  matchers:
  - type: word
    words:
    - redis_version
  - type: word
    negative: true
    words:
    - redis_mode:sentinel
