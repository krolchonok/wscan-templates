id: elasticsearch-default-login
info:
  name: 'Kibana: стандартная учётка elastic/changeme (login API)'
  author: Mohammad Reza Omrani | @omranisecurity
  severity: high
  description: 'Локальная правка метаданных wscan: это POST Kibana /internal/security/login, а не Elasticsearch
    REST API. Проверяется cookie sid и kbn-license-sig после входа elastic/changeme. Требует совместимого
    Kibana basic provider и заголовка kbn-version 8.8.2; отказ другой версии не доказывает безопасный
    пароль. Создаёт сеанс входа, без изменения данных.'
  reference:
  - https://www.alibabacloud.com/blog/what-is-the-default-username-and-password-for-elasticsearch_599610
  - https://www.elastic.co/guide/en/elasticsearch/reference/current/built-in-users.html
  classification:
    cpe: cpe:2.3:a:elastic:kibana:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-request: 1
    vendor: elastic
    product: kibana
    shodan-query: http.title:"Elastic" || http.favicon.hash:1328449667
  tags: default-login,kibana,vuln
http:
- raw:
  - 'POST /internal/security/login HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows; Windows NT 10.1; Win64; x64; en-US) Gecko/20100101 Firefox/49.5

    Referer: {{RootURL}}/login

    Content-Type: application/json

    kbn-version: 8.8.2

    x-kbn-context: %7B%22name%22%3A%22security_login%22%2C%22url%22%3A%22%2Flogin%22%7D

    Origin: {{RootURL}}


    {"providerType":"basic","providerName":"basic","currentURL":"{{BaseURL}}/login","params":{"username":"{{username}}","password":"{{password}}"
    }}

    '
  payloads:
    username:
    - elastic
    password:
    - changeme
  attack: pitchfork
  matchers-condition: and
  matchers:
  - type: word
    part: header
    words:
    - 'Set-Cookie: sid='
    - 'kbn-license-sig:'
    condition: and
    case-insensitive: true
  - type: status
    status:
    - 200
